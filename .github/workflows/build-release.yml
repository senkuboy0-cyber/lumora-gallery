name: Build & Release Lumora APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APKs for all architectures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Fix Gradle wrapper version
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.4.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build arm64-v8a APK
        run: |
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a
          cp app/build/outputs/apk/release/*.apk Lumora-arm64-v8a.apk

      - name: Build armeabi-v7a APK
        run: |
          ./gradlew assembleRelease -Pandroid.injected.build.abi=armeabi-v7a
          cp app/build/outputs/apk/release/*.apk Lumora-armeabi-v7a.apk

      - name: Build x86 APK
        run: |
          ./gradlew assembleRelease -Pandroid.injected.build.abi=x86
          cp app/build/outputs/apk/release/*.apk Lumora-x86.apk

      - name: Build x86_64 APK
        run: |
          ./gradlew assembleRelease -Pandroid.injected.build.abi=x86_64
          cp app/build/outputs/apk/release/*.apk Lumora-x86_64.apk

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-APKs
          path: |
            Lumora-arm64-v8a.apk
            Lumora-armeabi-v7a.apk
            Lumora-x86.apk
            Lumora-x86_64.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Lumora ${{ github.ref_name }}"
          body: |
            ## Lumora ${{ github.ref_name }}

            | APK | Device |
            |-----|--------|
            | `Lumora-arm64-v8a.apk` | Modern phones — Recommended |
            | `Lumora-armeabi-v7a.apk` | Older phones (32-bit) |
            | `Lumora-x86.apk` | Emulator (32-bit) |
            | `Lumora-x86_64.apk` | Emulator (64-bit) |
          files: |
            Lumora-arm64-v8a.apk
            Lumora-armeabi-v7a.apk
            Lumora-x86.apk
            Lumora-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
