name: Build & Release Lumora APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs for all architectures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build arm64-v8a APK
        run: |
          gradle assembleRelease -Pandroid.injected.build.abi=arm64-v8a
          find app/build/outputs -name '*.apk' -exec cp {} Lumora-arm64-v8a.apk \; -quit

      - name: Build armeabi-v7a APK
        run: |
          gradle assembleRelease -Pandroid.injected.build.abi=armeabi-v7a
          find app/build/outputs -name '*.apk' -exec cp {} Lumora-armeabi-v7a.apk \; -quit

      - name: Build x86 APK
        run: |
          gradle assembleRelease -Pandroid.injected.build.abi=x86
          find app/build/outputs -name '*.apk' -exec cp {} Lumora-x86.apk \; -quit

      - name: Build x86_64 APK
        run: |
          gradle assembleRelease -Pandroid.injected.build.abi=x86_64
          find app/build/outputs -name '*.apk' -exec cp {} Lumora-x86_64.apk \; -quit

      - name: Verify APK outputs
        run: ls -lh Lumora-*.apk

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-APKs
          path: Lumora-*.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: Lumora-APKs
          path: .

      - name: Display downloaded files
        run: ls -lh Lumora-*.apk

      - name: Create Release with APK files
        uses: softprops/action-gh-release@v2
        with:
          name: "Lumora ${{ github.ref_name }}"
          body: |
            ## Lumora ${{ github.ref_name }}

            ### Download APK for your device:
            | APK | Architecture | Use Case |
            |-----|--------------|----------|
            | `Lumora-arm64-v8a.apk` | arm64-v8a | Modern phones (Recommended) |
            | `Lumora-armeabi-v7a.apk` | armeabi-v7a | Older phones (32-bit) |
            | `Lumora-x86.apk` | x86 | Emulator (32-bit) |
            | `Lumora-x86_64.apk` | x86_64 | Emulator (64-bit) |

            ### Installation:
            1. Download the correct APK for your device
            2. Enable "Install from unknown sources"
            3. Install and enjoy!
          draft: true
          prerelease: false
          files: |
            Lumora-arm64-v8a.apk
            Lumora-armeabi-v7a.apk
            Lumora-x86.apk
            Lumora-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
