name: Android Multi-ABI APK Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
          -Pandroid.injected.build.abi=${{ matrix.abi }}

      - name: Rename APK
        run: |
          mkdir -p output

          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          cp "$APK_PATH" "output/LumoraGallery-${{ matrix.abi }}-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumoraGallery-${{ matrix.abi }}
          path: output/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download All APKs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Tag
        id: tag
        run: |
          echo "tag=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Lumora Gallery Build ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
