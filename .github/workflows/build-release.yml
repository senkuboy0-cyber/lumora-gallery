name: Build & Release Lumora APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs for all architectures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build arm64-v8a APK
        run: |
          gradle assembleRelease -Pandroid.injected.build.abi=arm64-v8a
          echo "=== Build outputs ==="
          find app/build/outputs -name '*.apk' 2>/dev/null || echo "No APK found"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "Release dir not found"
          find app/build/outputs -name '*.apk' -exec cp {} Lumora-arm64-v8a.apk \; || true

      - name: Build armeabi-v7a APK
        run: |
          gradle assembleRelease -Pandroid.injected.build.abi=armeabi-v7a
          echo "=== Build outputs ==="
          find app/build/outputs -name '*.apk' 2>/dev/null || echo "No APK found"
          find app/build/outputs -name '*.apk' -exec cp {} Lumora-armeabi-v7a.apk \; || true

      - name: Build x86 APK
        run: |
          gradle assembleRelease -Pandroid.injected.build.abi=x86
          echo "=== Build outputs ==="
          find app/build/outputs -name '*.apk' 2>/dev/null || echo "No APK found"
          find app/build/outputs -name '*.apk' -exec cp {} Lumora-x86.apk \; || true

      - name: Build x86_64 APK
        run: |
          gradle assembleRelease -Pandroid.injected.build.abi=x86_64
          echo "=== Build outputs ==="
          find app/build/outputs -name '*.apk' 2>/dev/null || echo "No APK found"
          find app/build/outputs -name '*.apk' -exec cp {} Lumora-x86_64.apk \; || true

      - name: Verify APK outputs
        run: |
          echo "=== Final APK check ==="
          ls -la Lumora-*.apk 2>/dev/null || echo "No APKs found"
          for apk in Lumora-*.apk; do
            if [ -f "$apk" ]; then
              echo "$apk: $(ls -lh "$apk" | awk '{print $5}')"
            fi
          done

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-APKs
          path: Lumora-*.apk

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lumora-APKs
          path: release-assets

      - name: Verify downloaded APKs
        run: find release-assets -name '*.apk' -print -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lumora ${{ github.ref_name }}"
          body: |
            ## Lumora ${{ github.ref_name }}
            | APK | Device |
            |-----|--------|
            | `Lumora-arm64-v8a.apk` | Modern phones - Recommended |
            | `Lumora-armeabi-v7a.apk` | Older phones (32-bit) |
            | `Lumora-x86.apk` | Emulator (32-bit) |
            | `Lumora-x86_64.apk` | Emulator (64-bit) |
          files: |
            release-assets/**/Lumora-arm64-v8a.apk
            release-assets/**/Lumora-armeabi-v7a.apk
            release-assets/**/Lumora-x86.apk
            release-assets/**/Lumora-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
