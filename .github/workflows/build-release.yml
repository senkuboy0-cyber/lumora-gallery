name: Android Multi ABI Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Force Gradle Wrapper Update
        run: |
          gradle wrapper --gradle-version 9.4.1
          ./gradlew --version

      - name: Clean Project
        run: ./gradlew clean

      - name: Build APK
        run: |
          ./gradlew assembleDebug \
          -Pandroid.injected.build.abi=${{ matrix.abi }}

      - name: Create Output Folder
        run: mkdir -p output

      - name: Copy APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          cp "$APK" \
          "output/LumoraGallery-${{ matrix.abi }}-debug.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.abi }}-apk
          path: output/*.apk

  release:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Tag
        id: tag
        run: |
          echo "tag=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Lumora Gallery Build
          files: artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
